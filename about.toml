# cargo-about: the licenses of the Rust crates built into md-notes-sync.exe,
# for THIRD-PARTY-NOTICES.html in the release zip (package.ps1).
# Only licenses that may be shipped in a GPL-3.0-or-later program are accepted.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "BSL-1.0",
    "0BSD",
]
# Only what goes into the Windows exe
targets = ["x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Our own crates (publish = false)
private = { ignore = true }
