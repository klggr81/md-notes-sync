[package]
name = "sync-core"
description = "Sync logic of md-notes-sync: sets up rclone and runs rclone bisync between a cloud folder and a folder on Windows"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
ureq = { version = "3.5.0", default-features = false, features = ["native-tls-no-default", "json"] }
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Security"] }
