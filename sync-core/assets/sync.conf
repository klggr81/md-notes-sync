# md-notes-sync settings (KEY=VALUE, lines starting with # are ignored).
# The setup in the app writes this file next to md-notes-sync.exe and fills in
# LOCAL, REMOTE and RCLONE. It can also be edited by hand; the app reads it
# before every sync. %USERPROFILE% and other environment variables may be used
# in LOCAL and RCLONE.

# Notes folder on this PC
LOCAL=%USERPROFILE%\Notes

# Notes folder in the cloud: <rclone remote>:<folder>, for example Nextcloud:Notes,
# Dropbox:Notes or GoogleDrive:Notes. The remotes are in rclone.conf next to the app.
REMOTE=Nextcloud:Notes

# rclone program: rclone\rclone.exe = the copy the setup downloaded next to the app,
# "rclone" = the one on the PATH
RCLONE=rclone\rclone.exe

# Extra bisync flags
#   --conflict-resolve newer  file changed on both sides: newer one wins, older kept as .conflict copy
#   --resilient --recover     retry after minor errors / interrupted runs instead of demanding a resync
#   --max-lock 2m             a lock left behind by a crashed run expires after 2 minutes
#   --max-delete 25           stop if more than 25% of files would be deleted (protects against an empty side)
#   --check-access            refuse to sync unless the RCLONE_TEST marker file exists on both sides
#                             (protects against a missing, wrong or empty folder). Never delete RCLONE_TEST.
EXTRA_FLAGS=--conflict-resolve newer --resilient --recover --max-lock 2m --max-delete 25 --create-empty-src-dirs --check-access

# Weekly backup: before a sync, if the newest backup is a week old (or there is
# none), the notes folder is zipped into backups\notes-YYYY-MM-DD.zip.
# Number of backups to keep (0 = no backups).
BACKUP_KEEP=3
